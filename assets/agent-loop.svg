<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-label="How I build agents: a user goal goes to a planner, which calls tools and retrieves memory, then an evaluation step either loops back to the planner or returns the result.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B18"/><stop offset="1" stop-color="#0E1430"/></linearGradient>
    <linearGradient id="wire" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#A78BFA"/><stop offset="1" stop-color="#34D399"/></linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="1000" height="270" rx="22"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace}
      .sans{font-family:'Segoe UI','Inter',system-ui,-apple-system,Helvetica,Arial,sans-serif}
      .flow{stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
      .flowr{stroke-dasharray:4 8;animation:flow 1.6s linear infinite reverse}
      @keyframes flow{to{stroke-dashoffset:-28}}
      .n{animation:lit 6s ease-in-out infinite}
      @keyframes lit{0%,100%{stroke-opacity:.45}10%,22%{stroke-opacity:1}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="270" fill="url(#bg)"/>
    <text x="40" y="38" class="mono" font-size="13" fill="#64748B">// how I build agents</text>
    <text x="960" y="38" text-anchor="end" class="mono" font-size="13" fill="#64748B">plan → act → observe → repeat</text>

    <!-- wires -->
    <g fill="none" stroke-width="2">
      <path d="M150 135 L250 135" stroke="#334155"/>
      <path d="M150 135 L250 135" stroke="url(#wire)" class="flow"/>
      <path id="pt" d="M90 135 L280 135 L480 85 L680 135 L880 135" stroke="none"/>
      <path id="pm" d="M90 135 L280 135 L480 180 L680 135 L880 135" stroke="none"/>
      <path d="M310 125 L440 92 M520 92 L650 125" stroke="#334155"/>
      <path d="M310 125 L440 92 M520 92 L650 125" stroke="#22D3EE" class="flow" opacity="0.8"/>
      <path d="M310 145 L440 175 M520 175 L650 145" stroke="#334155"/>
      <path d="M310 145 L440 175 M520 175 L650 145" stroke="#F472B6" class="flow" opacity="0.8"/>
      <path d="M720 135 L820 135" stroke="#334155"/>
      <path d="M720 135 L820 135" stroke="#34D399" class="flow"/>
      <path id="loop" d="M680 160 C 640 268, 320 268, 280 160" stroke="#FBBF24" stroke-opacity="0.7" class="flowr"/>
    </g>
    <text x="480" y="252" text-anchor="middle" class="mono" font-size="11.5" fill="#FBBF24" opacity="0.85">needs more context? loop back</text>

    <!-- packets -->
    <circle r="5" fill="#22D3EE" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#pt"/></animateMotion></circle>
    <circle r="5" fill="#F472B6" filter="url(#glow)"><animateMotion dur="6s" begin="3s" repeatCount="indefinite"><mpath href="#pm"/></animateMotion></circle>
    <circle r="4" fill="#FBBF24" filter="url(#glow)"><animateMotion dur="4s" begin="1s" repeatCount="indefinite"><mpath href="#loop"/></animateMotion></circle>

    <!-- nodes -->
    <g class="sans" text-anchor="middle">
      <g><rect x="40" y="110" width="110" height="50" rx="25" fill="#0F172A" stroke="#94A3B8" stroke-width="1.5" class="n"/>
        <text x="95" y="140" font-size="15" font-weight="700" fill="#E2E8F0">User goal</text></g>
      <g><rect x="250" y="105" width="120" height="60" rx="14" fill="#1E1B4B" stroke="#A78BFA" stroke-width="1.5" class="n" style="animation-delay:.9s"/>
        <text x="310" y="132" font-size="15" font-weight="700" fill="#EDE9FE">Planner</text>
        <text x="310" y="151" class="mono" font-size="10.5" fill="#A5B4FC">LLM reasoning</text></g>
      <g><rect x="410" y="62" width="140" height="48" rx="12" fill="#082F49" stroke="#22D3EE" stroke-width="1.5" class="n" style="animation-delay:1.9s"/>
        <text x="480" y="84" font-size="14" font-weight="700" fill="#CFFAFE">Tools</text>
        <text x="480" y="100" class="mono" font-size="10" fill="#67E8F9">APIs · DB · search</text></g>
      <g><rect x="410" y="156" width="140" height="48" rx="12" fill="#3B0A2A" stroke="#F472B6" stroke-width="1.5" class="n" style="animation-delay:1.9s"/>
        <text x="480" y="178" font-size="14" font-weight="700" fill="#FCE7F3">Memory</text>
        <text x="480" y="194" class="mono" font-size="10" fill="#F9A8D4">RAG · vectors</text></g>
      <g><rect x="605" y="105" width="150" height="60" rx="14" fill="#052E1F" stroke="#34D399" stroke-width="1.5" class="n" style="animation-delay:3s"/>
        <text x="680" y="132" font-size="15" font-weight="700" fill="#D1FAE5">Evaluate</text>
        <text x="680" y="151" class="mono" font-size="10.5" fill="#6EE7B7">guardrails · evals</text></g>
      <g><rect x="820" y="110" width="130" height="50" rx="25" fill="#0F172A" stroke="#34D399" stroke-width="1.5" class="n" style="animation-delay:4s"/>
        <text x="885" y="140" font-size="15" font-weight="700" fill="#E2E8F0">Result ✓</text></g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="269" rx="22" fill="none" stroke="#1E293B"/>
</svg>
