<text x="24" y="112" class="sans" font-size="13.5" fill="#94A3B8">Support assistant that answers questions about</text>
<text x="24" y="132" class="sans" font-size="13.5" fill="#94A3B8">a judicial circular, grounded with retrieval.</text>
