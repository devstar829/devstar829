<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="5s" repeatCount="indefinite"/><rect x="0" y="0" width="100" height="22" rx="11" fill="#1E293B"/><text x="10" y="14" fill="#CBD5E1">what does s.4 say?</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.35;.45;.85;1" dur="5s" repeatCount="indefinite"/><rect x="34" y="30" width="100" height="22" rx="11" fill="#4C1D95"/><text x="44" y="44" fill="#EDE9FE">per the circular...</text></g>
<g transform="translate(60 68)"><circle cx="0" r="3" fill="#A78BFA"><animate attributeName="opacity" values=".2;1;.2" dur="1s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="10" r="3" fill="#A78BFA"><animate attributeName="opacity" values=".2;1;.2" dur="1s" begin="0.2s" repeatCount="indefinite"/></circle><circle cx="20" r="3" fill="#A78BFA"><animate attributeName="opacity" values=".2;1;.2" dur="1s" begin="0.4s" repeatCount="indefinite"/></circle></g></g>
