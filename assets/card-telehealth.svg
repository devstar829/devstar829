<text x="24" y="132" class="sans" font-size="13.5" fill="#94A3B8">AI symptom-analysis chatbot.</text>
<rect x="24" y="168" width="89" height="24" rx="12" fill="#F472B6" fill-opacity=".12" stroke="#F472B6" stroke-opacity=".5"/><text x="68" y="184" text-anchor="middle" class="mono" font-size="11.5" fill="#F472B6">JavaScript</text><rect x="121" y="168" width="89" height="24" rx="12" fill="#F472B6" fill-opacity=".12" stroke="#F472B6" stroke-opacity=".5"/><text x="166" y="184" text-anchor="middle" class="mono" font-size="11.5" fill="#F472B6">AI chatbot</text><rect x="218" y="168" width="89" height="24" rx="12" fill="#F472B6" fill-opacity=".12" stroke="#F472B6" stroke-opacity=".5"/><text x="262" y="184" text-anchor="middle" class="mono" font-size="11.5" fill="#F472B6">Healthcare</text>
<text x="456" y="185" text-anchor="end" class="mono" font-size="12" fill="#64748B">view repo →</text>
