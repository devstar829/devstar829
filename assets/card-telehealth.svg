<path d="M8 32 H38 L46 14 L54 48 L62 24 L68 32 H112" fill="none" stroke="#F472B6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="140" stroke-dashoffset="140"><animate attributeName="stroke-dashoffset" values="140;0;-140" dur="2.4s" repeatCount="indefinite"/></path>
