" fill="#94A3B8">⎿  <tspan fill="#34D399">24 passed</tspan> in 1.82s</text></g><g opacity="0"><animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.7625;0.7705;0.9625;0.9705;1"/><circle cx="49" cy="417" r="4" fill="#E2E8F0"/><text x="64" y="422" class="m" font-size="13.5" fill="#E2E8F0">Done. Flaky tool calls now retry, and failed evals trigger a re-plan. ✓</text></g><rect x="28" y="458" width="944" height="36" rx="8" fill="none" stroke="#334155"/>
